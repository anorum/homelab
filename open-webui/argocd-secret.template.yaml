# Plaintext template — do NOT commit this file.
# Steps to create the encrypted secret:
#   1. Get your ArgoCD token:
#        ssh -i ~/.ssh/rpi_key anorum@192.168.1.101 \
#          "sudo kubectl exec -n argocd deploy/argocd-server -- \
#           argocd account generate-token --account admin"
#      Or: https://argo.alexnorum.com → User Info → Generate Token
#
#   2. Replace <TOKEN> below and encrypt:
#        cp open-webui/argocd-secret.template.yaml /tmp/argocd-secret.yaml
#        # edit /tmp/argocd-secret.yaml with real token
#        sops -e /tmp/argocd-secret.yaml > open-webui/argocd-secret.enc.yaml
#        rm /tmp/argocd-secret.yaml
#
#   3. Commit argocd-secret.enc.yaml (NOT this template, NOT the plaintext)

apiVersion: v1
kind: Secret
metadata:
  name: open-webui-argocd
  namespace: open-webui
stringData:
  ARGOCD_TOKEN: "<TOKEN>"
