apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prometheus

resources:
  - namespace.yaml
  - helmchart.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prometheus-grafana
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: prometheus-grafana
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-alertmanager
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-alertmanager
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-prometheus
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-prometheus
      namespace: prometheus

labels:
- pairs:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
