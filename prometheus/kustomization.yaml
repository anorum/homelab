apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prometheus

resources:
  - namespace.yaml
  - httproutes.yaml
  - homelab-rules.yaml

generators:
  - discord-webhook-secret-generator.yaml
  - ha-scrape-secret-generator.yaml

helmCharts:
  - name: kube-prometheus-stack
    includeCRDs: false
    repo: https://prometheus-community.github.io/helm-charts
    version: 82.10.1
    releaseName: prometheus
    namespace: prometheus
    valuesInline:
      crds:
        enabled: false
      grafana:
        enabled: true
        service:
          selector:
            app.kubernetes.io/instance: prometheus
            app.kubernetes.io/name: grafana
        ingress:
          enabled: false
        persistence:
          type: pvc
          enabled: true
          accessModes:
            - ReadWriteOnce
          size: 1Gi
        deploymentStrategy:
          type: Recreate
        additionalDataSources:
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.loki:3100
            access: proxy
            isDefault: false
        grafana.ini:
          server:
            root_url: http://grafana.home.alexnorum.com
          auth:
            disable_login_form: true
          auth.anonymous:
            enabled: true
            org_role: Admin
          auth.basic:
            enabled: false
      prometheus:
        thanosService:
          enabled: false
        thanosServiceExternal:
          enabled: false
        prometheusSpec:
          replicas: 1
          retention: 7d
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 5Gi
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          additionalScrapeConfigsSecret:
            enabled: true
            name: ha-scrape-config
            key: additional-scrape-configs.yaml
        ingress:
          enabled: false
      kubeEtcd:
        enabled: true
      kubeScheduler:
        enabled: true
      kubeControllerManager:
        enabled: true
      alertmanager:
        enabled: true
        ingress:
          enabled: false
        alertmanagerSpec:
          secrets:
            - discord-webhook
        config:
          global:
            resolve_timeout: 10m
          inhibit_rules:
            - source_matchers:
                - "severity = critical"
              target_matchers:
                - "severity =~ warning|info"
              equal: ["namespace", "alertname"]
            - source_matchers:
                - "severity = warning"
              target_matchers:
                - "severity = info"
              equal: ["namespace", "alertname"]
            - source_matchers:
                - "alertname = InfoInhibitor"
              target_matchers:
                - "severity = info"
              equal: ["namespace"]
            - target_matchers:
                - "alertname = InfoInhibitor"
          route:
            group_by: ["namespace", "alertname"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: "discord"
            routes:
              - receiver: "null"
                matchers:
                  - alertname = "Watchdog"
              - receiver: "null"
                matchers:
                  - alertname = "InfoInhibitor"
              # k3s embeds these components — metrics not exposed, alerts always fire
              - receiver: "null"
                matchers:
                  - alertname =~ "KubeSchedulerDown|KubeControllerManagerDown|KubeProxyDown"
              - receiver: "null"
                matchers:
                  - alertname =~ "etcd.*"
              # Not useful for a 2-node homelab
              - receiver: "null"
                matchers:
                  - alertname =~ "KubeMemoryOvercommit|KubeCPUOvercommit"
          receivers:
            - name: "null"
            - name: "discord"
              slack_configs:
                - api_url_file: "/etc/alertmanager/secrets/discord-webhook/webhook-url"
                  send_resolved: true
                  title: '{{ if eq .Status "firing" }}[FIRING:{{ .Alerts.Firing | len }}]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}'
                  text: |-
                    {{ range .Alerts }}
                    *Alert:* {{ .Labels.alertname }} ({{ .Labels.severity }})
                    *Namespace:* {{ .Labels.namespace }}
                    {{ if .Annotations.summary }}*Summary:* {{ .Annotations.summary }}{{ end }}
                    {{ if .Annotations.description }}*Description:* {{ .Annotations.description }}{{ end }}
                    {{ end }}
          templates:
            - "/etc/alertmanager/config/*.tmpl"

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prometheus-grafana
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: prometheus-grafana
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-alertmanager
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-alertmanager
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-prometheus
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-prometheus
      namespace: prometheus
