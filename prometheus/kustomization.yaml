apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prometheus

resources:
  - namespace.yaml
  - httproutes.yaml

helmCharts:
  - name: kube-prometheus-stack
    includeCRDs: false
    repo: https://prometheus-community.github.io/helm-charts
    version: 82.2.1
    releaseName: prometheus
    namespace: prometheus
    valuesInline:
      crds:
        enabled: false
      grafana:
        enabled: true
        service:
          selector:
            app.kubernetes.io/instance: prometheus
            app.kubernetes.io/name: grafana
        ingress:
          enabled: false
        persistence:
          type: pvc
          enabled: true
          accessModes:
            - ReadWriteOnce
          size: 1Gi
        deploymentStrategy:
          type: Recreate
        grafana.ini:
          server:
            root_url: http://grafana.homelab
      prometheus:
        thanosService:
          enabled: true
        thanosServiceExternal:
          enabled: true
        prometheusSpec:
          replicas: 1
          alertingEndpoints:
            - namespace: prometheus
              name: prometheus-kube-prometheus-alertmanager
              port: http-web
              pathPrefix: "/"
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                storageClassName: local-ssd-storage
                resources:
                  requests:
                    storage: 10Gi
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          securityContext:
            runAsNonRoot: false
            runAsGroup: 0
            runAsUser: 0
            fsGroup: 0
        ingress:
          enabled: false
        thanosIngress:
          enabled: false
      kubeEtcd:
        enabled: true
      kubeScheduler:
        enabled: true
      kubeControllerManager:
        enabled: true
      alertmanager:
        enabled: true
        ingress:
          enabled: false

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prometheus-grafana
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: prometheus-grafana
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-alertmanager
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-alertmanager
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-prometheus
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-prometheus
      namespace: prometheus

labels:
- pairs:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
