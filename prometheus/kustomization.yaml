apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prometheus

resources:
  - namespace.yaml
  - httproutes.yaml
  - homelab-rules.yaml
  - mac-mini-scrapeconfig.yaml

generators:
  - discord-webhook-secret-generator.yaml
  - ha-scrape-secret-generator.yaml

helmCharts:
  - name: kube-prometheus-stack
    includeCRDs: false
    repo: https://prometheus-community.github.io/helm-charts
    version: 82.10.1
    releaseName: prometheus
    namespace: prometheus
    valuesInline:
      crds:
        enabled: false
      grafana:
        enabled: true
        # Measured ~340Mi. Dashboard rendering is the spiky part, so the limit
        # sits well clear of steady state rather than hugging it.
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
        # The dashboard/datasource sidecars are two more unlimited containers
        # hiding inside a pod that otherwise looks accounted for.
        sidecar:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
        service:
          selector:
            app.kubernetes.io/instance: prometheus
            app.kubernetes.io/name: grafana
        ingress:
          enabled: false
        persistence:
          type: pvc
          enabled: true
          accessModes:
            - ReadWriteOnce
          size: 1Gi
        deploymentStrategy:
          type: Recreate
        additionalDataSources:
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.loki:3100
            access: proxy
            isDefault: false
        grafana.ini:
          server:
            root_url: http://grafana.home.alexnorum.com
          auth:
            disable_login_form: true
          auth.anonymous:
            enabled: true
            org_role: Admin
          auth.basic:
            enabled: false
      prometheus:
        thanosService:
          enabled: false
        thanosServiceExternal:
          enabled: false
        prometheusSpec:
          replicas: 1
          retention: 7d
          # Prometheus is the second-largest consumer on swagman-2 and ran
          # unbounded until now. Its TSDB is a node-local `local-path` PVC bound
          # to swagman-2, so it cannot be moved to the emptier node without
          # abandoning the data - capping it in place is the available lever.
          #
          # Measured at ~860Mi with 7d retention. 1536Mi leaves room for a
          # compaction spike without letting a runaway query walk the node into
          # a kernel OOM, where the victim would not necessarily be Prometheus.
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 1536Mi
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 5Gi
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          additionalScrapeConfigsSecret:
            enabled: true
            name: ha-scrape-config
            key: additional-scrape-configs.yaml
        ingress:
          enabled: false
      # k3s embeds etcd/scheduler/controller-manager/proxy in the server process and
      # exposes no separate metrics endpoints, so these scrape targets can never come up.
      # Disabling them removes both the ServiceMonitors and their permanently-firing
      # *Down alert rules at the source, rather than muting them at the route.
      kubeEtcd:
        enabled: false
      kubeScheduler:
        enabled: false
      kubeControllerManager:
        enabled: false
      kubeProxy:
        enabled: false
      # The stack's supporting components shipped without limits, which is what
      # let the node's total limit commitment drift past 100% unnoticed - the
      # scheduler cannot count what is not declared. All three are small and
      # flat; these caps are headroom, not tuning.
      prometheusOperator:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 192Mi
      kube-state-metrics:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 192Mi
      prometheus-node-exporter:
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 96Mi
      alertmanager:
        enabled: true
        ingress:
          enabled: false
        alertmanagerSpec:
          secrets:
            - discord-webhook
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
        config:
          global:
            resolve_timeout: 10m
          inhibit_rules:
            - source_matchers:
                - "severity = critical"
              target_matchers:
                - "severity =~ warning|info"
              equal: ["namespace", "alertname"]
            - source_matchers:
                - "severity = warning"
              target_matchers:
                - "severity = info"
              equal: ["namespace", "alertname"]
            - source_matchers:
                - "alertname = InfoInhibitor"
              target_matchers:
                - "severity = info"
              equal: ["namespace"]
            - target_matchers:
                - "alertname = InfoInhibitor"
            # Warning/Critical pairs with different alertnames — suppress warning when critical fires
            - source_matchers:
                - alertname = "MacMiniDataDiskCritical"
              target_matchers:
                - alertname = "MacMiniDataDiskWarning"
            - source_matchers:
                - alertname = "HomelabHddUsageCritical"
              target_matchers:
                - alertname = "HomelabHddUsageWarning"
          route:
            group_by: ["namespace", "alertname"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            # Default receiver — anything not matched by a "null" route below is delivered.
            receiver: "discord"
            routes:
              - receiver: "null"
                matchers:
                  - alertname = "Watchdog"
              - receiver: "null"
                matchers:
                  - alertname = "InfoInhibitor"
              # Belt-and-braces: the kubeScheduler/kubeControllerManager/kubeProxy/kubeEtcd
              # exporters are disabled above, so these rules no longer exist. Kept so the
              # alerts stay muted if a chart upgrade re-enables the components.
              - receiver: "null"
                matchers:
                  - alertname =~ "KubeSchedulerDown|KubeControllerManagerDown|KubeProxyDown"
              - receiver: "null"
                matchers:
                  - alertname =~ "etcd.*"
              # Not useful for a 2-node homelab
              - receiver: "null"
                matchers:
                  - alertname =~ "KubeMemoryOvercommit|KubeCPUOvercommit"
              # Suppress meta-alerts that cause a feedback loop when Discord webhook fails
              - receiver: "null"
                matchers:
                  - alertname =~ "AlertmanagerFailedToSendAlerts|AlertmanagerClusterFailedToSendAlerts"
              # KubeJobFailed duplicates HomelabBackupFailed for backup jobs
              - receiver: "null"
                matchers:
                  - alertname = "KubeJobFailed"
                  - namespace = "backup"
              # Warnings are delivered, but re-notify every 24h instead of 12h so
              # persistent non-critical issues stay visible without being noisy.
              - receiver: "discord"
                matchers:
                  - severity = "warning"
                repeat_interval: 24h
          receivers:
            - name: "null"
            - name: "discord"
              slack_configs:
                - api_url_file: "/etc/alertmanager/secrets/discord-webhook/webhook-url"
                  send_resolved: true
                  title: '{{ if eq .Status "firing" }}[FIRING:{{ .Alerts.Firing | len }}]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}'
                  # Discord rejects bodies over 4096 chars with a 400. A group can hold
                  # dozens of alerts (e.g. 64x HomelabArgoOutOfSync), so render at most 8
                  # and drop the long description field — summary alone keeps us well under.
                  text: |-
                    {{ range $i, $a := .Alerts }}{{ if lt $i 8 }}*Alert:* {{ $a.Labels.alertname }} ({{ $a.Labels.severity }})
                    *Namespace:* {{ $a.Labels.namespace }}
                    {{ if $a.Annotations.summary }}*Summary:* {{ $a.Annotations.summary }}{{ end }}
                    {{ end }}{{ end }}{{ if gt (len .Alerts) 8 }}
                    _...showing 8 of {{ len .Alerts }} alerts in this group_{{ end }}
                    {{ if not .Alerts }}(no alert details){{ end }}
          templates:
            - "/etc/alertmanager/config/*.tmpl"

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prometheus-grafana
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: prometheus-grafana
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-alertmanager
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-alertmanager
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-prometheus
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-prometheus
      namespace: prometheus
