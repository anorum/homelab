apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prometheus

resources:
  - namespace.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    releaseName: prometheus
    namespace: prometheus
    valuesInline:
      grafana:
        enabled: true
        service:
          selector:
            app.kubernetes.io/instance: prometheus
            app.kubernetes.io/name: grafana
        ingress:
          enabled: true
          hosts:
          - grafana.homelab
          ingressClassName: nginx
          pathType: Prefix
          annotations:
            kubernetes.io/ingress.class: nginx
            nginx.ingress.kubernetes.io/ssl-redirect: "false"
            gethomepage.dev/enabled: "true"
            gethomepage.dev/description: Grafana Monitoring
            gethomepage.dev/group: Monitoring
            gethomepage.dev/icon: grafana.png
            gethomepage.dev/name: Grafana
            gethomepage.dev/pod-selector: "app.kubernetes.io/name=grafana"
            gethomepage.dev/widget.type: "grafana"
            gethomepage.dev/widget.url: "http://prometheus-grafana.prometheus.svc.cluster.local"
            gethomepage.dev/widget.username: '{{`{{HOMEPAGE_VAR_GRAFANA_USERNAME}}`}}'
            gethomepage.dev/widget.password: '{{`{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}`}}' # only available locally and default 
        persistence:
          type: pvc
          enabled: true
          accessModes:
            - ReadWriteOnce
          size: 1Gi
        deploymentStrategy:
          type: Recreate
        grafana.ini:
          server:
            root_url: http://grafana.homelab
      prometheus:
        thanosService:
          enabled: true
        thanosServiceExternal:
          enabled: true
        prometheusSpec:
          replicas: 1
          alertingEndpoints:
            - namespace: prometheus
              name: prometheus-kube-prometheus-alertmanager
              port: http-web
              pathPrefix: "/"
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes: [ "ReadWriteOnce" ]
                resources:
                  requests:
                    storage: 1Gi
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          securityContext:
            runAsNonRoot: false
            runAsGroup: 0
            runAsUser: 0
            fsGroup: 0
        ingress:
          enabled: true
          hosts:
          - prometheus.homelab
          ingressClassName: nginx
          pathType: Prefix
          annotations:
            kubernetes.io/ingress.class: nginx
            gethomepage.dev/enabled: "true"
            gethomepage.dev/description: Metrics and Monitoring
            gethomepage.dev/group: Monitoring
            gethomepage.dev/icon: prometheus.png
            gethomepage.dev/name: Prometheus
            gethomepage.dev/pod-selector: app.kubernetes.io/name=prometheus
            gethomepage.dev/widget.type: "prometheus"
            gethomepage.dev/widget.url: "http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090"
        thanosIngress:
          enabled: true
          hosts:
          - thanos.homelab
          ingressClassName: nginx
          pathType: Prefix
          annotations:
            kubernetes.io/ingress.class: nginx
      kubeEtcd:
        enabled: true
      kubeScheduler:
        enabled: true
      kubeControllerManager:
        enabled: true
      alertmanager:
        enabled: true
        ingress:
          enabled: true
          hosts:
          - alertmanager.homelab
          pathType: Prefix
          ingressClassName: nginx
          annotations:
            kubernetes.io/ingress.class: nginx
            gethomepage.dev/enabled: "true"
            gethomepage.dev/description: Alert Management
            gethomepage.dev/group: Monitoring
            gethomepage.dev/icon: alertmanager.png
            gethomepage.dev/name: Alert Manager
            gethomepage.dev/href: "alertmanager.homelab"
            gethomepage.dev/pod-selector: "app.kubernetes.io/name=alertmanager"
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prometheus-grafana
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: prometheus-grafana
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-alertmanager
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-alertmanager
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-prometheus
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-prometheus
      namespace: prometheus

labels:
- pairs:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
