apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prometheus

resources:
  - namespace.yaml
  - httproutes.yaml

generators:
  - discord-webhook-secret-generator.yaml
  - grafana-oauth-secret-generator.yaml

helmCharts:
  - name: kube-prometheus-stack
    includeCRDs: false
    repo: https://prometheus-community.github.io/helm-charts
    version: 82.2.1
    releaseName: prometheus
    namespace: prometheus
    valuesInline:
      crds:
        enabled: false
      grafana:
        enabled: true
        service:
          selector:
            app.kubernetes.io/instance: prometheus
            app.kubernetes.io/name: grafana
        ingress:
          enabled: false
        persistence:
          type: pvc
          enabled: true
          accessModes:
            - ReadWriteOnce
          size: 1Gi
        deploymentStrategy:
          type: Recreate
        additionalDataSources:
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.loki:3100
            access: proxy
            isDefault: false
        envFromSecret: grafana-oauth-secret
        grafana.ini:
          server:
            root_url: http://grafana.home.alexnorum.com
          auth.generic_oauth:
            enabled: true
            name: Authentik
            allow_sign_up: true
            client_id: mfRJRhWtDBQztXT9o-bS-j0zPYZEKCuAMvycoFsi
            scopes: openid email profile
            auth_url: https://sso.alexnorum.com/application/o/authorize/
            token_url: https://sso.alexnorum.com/application/o/token/
            api_url: https://sso.alexnorum.com/application/o/userinfo/
            role_attribute_path: "contains(groups[*], 'Grafana Admins') && 'Admin' || 'Viewer'"
      prometheus:
        thanosService:
          enabled: false
        thanosServiceExternal:
          enabled: false
        prometheusSpec:
          replicas: 1
          retention: 7d
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                storageClassName: local-path
                resources:
                  requests:
                    storage: 5Gi
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
        ingress:
          enabled: false
      kubeEtcd:
        enabled: true
      kubeScheduler:
        enabled: true
      kubeControllerManager:
        enabled: true
      alertmanager:
        enabled: true
        ingress:
          enabled: false
        alertmanagerSpec:
          secrets:
            - discord-webhook
        config:
          global:
            resolve_timeout: 5m
          inhibit_rules:
            - source_matchers:
                - "severity = critical"
              target_matchers:
                - "severity =~ warning|info"
              equal: ["namespace", "alertname"]
            - source_matchers:
                - "severity = warning"
              target_matchers:
                - "severity = info"
              equal: ["namespace", "alertname"]
            - source_matchers:
                - "alertname = InfoInhibitor"
              target_matchers:
                - "severity = info"
              equal: ["namespace"]
            - target_matchers:
                - "alertname = InfoInhibitor"
          route:
            group_by: ["namespace", "alertname"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: "discord"
            routes:
              - receiver: "null"
                matchers:
                  - alertname = "Watchdog"
              - receiver: "null"
                matchers:
                  - alertname = "InfoInhibitor"
          receivers:
            - name: "null"
            - name: "discord"
              webhook_configs:
                - url_file: "/etc/alertmanager/secrets/discord-webhook/webhook-url"
                  send_resolved: true
          templates:
            - "/etc/alertmanager/config/*.tmpl"

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: prometheus-grafana
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: prometheus-grafana
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-alertmanager
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-alertmanager
      namespace: prometheus
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: prometheus-kube-prometheus-prometheus
        namespace: prometheus
      spec:
        replicas: 1
    target:
      kind: StatefulSet
      name: prometheus-kube-prometheus-prometheus
      namespace: prometheus

labels:
- pairs:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
