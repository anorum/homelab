apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: prometheus
  namespace: prometheus
  annotations:
    helm.cattle.io/uninstall-on-failure: "true"
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  targetNamespace: prometheus
  valuesContent: |-
    grafana:
      enabled: true
      service:
        selector:
          app.kubernetes.io/instance: prometheus
          app.kubernetes.io/name: grafana
      ingress:
        enabled: true
        hosts:
        - grafana.homelab
        ingressClassName: nginx
        pathType: Prefix
        annotations:
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
      persistence:
        type: pvc
        enabled: true
        accessModes:
          - ReadWriteOnce
        size: 1Gi
      deploymentStrategy:
        type: Recreate
      grafana.ini:
        server:
          root_url: http://grafana.homelab
    prometheus:
      thanosService:
        enabled: true
      thanosServiceExternal:
        enabled: true
      prometheusSpec:
        replicas: 1
        alertingEndpoints:
          - namespace: prometheus
            name: prometheus-kube-prometheus-alertmanager
            port: http-web
            pathPrefix: "/"
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: [ "ReadWriteOnce" ]
              resources:
                requests:
                  storage: 1Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        securityContext:
          runAsNonRoot: false
          runAsGroup: 0
          runAsUser: 0
          fsGroup: 0
      ingress:
        enabled: true
        hosts:
        - prometheus.homelab
        ingressClassName: nginx
        pathType: Prefix
        annotations:
          kubernetes.io/ingress.class: nginx
      thanosIngress:
        enabled: true
        hosts:
        - thanos.homelab
        ingressClassName: nginx
        pathType: Prefix
        annotations:
          kubernetes.io/ingress.class: nginx
    kubeEtcd:
      enabled: true
    kubeScheduler:
      enabled: true
    kubeControllerManager:
      enabled: true
    alertmanager:
      enabled: true
      ingress:
        enabled: true
        hosts:
        - alertmanager.homelab
        pathType: Prefix
        ingressClassName: nginx
        annotations:
          kubernetes.io/ingress.class: nginx
