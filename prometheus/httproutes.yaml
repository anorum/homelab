apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: prometheus
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: prometheus
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Grafana Monitoring
    gethomepage.dev/group: Monitoring
    gethomepage.dev/icon: grafana.png
    gethomepage.dev/name: Grafana
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=grafana"
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      group: gateway.networking.k8s.io
      kind: Gateway
      sectionName: web
  hostnames:
    - grafana.home.alexnorum.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - name: prometheus-grafana
          group: ""
          kind: Service
          port: 80
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: prometheus
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Metrics and Monitoring
    gethomepage.dev/group: Monitoring
    gethomepage.dev/icon: prometheus.png
    gethomepage.dev/name: Prometheus
    gethomepage.dev/pod-selector: app.kubernetes.io/name=prometheus
    gethomepage.dev/widget.type: "prometheus"
    gethomepage.dev/widget.url: "http://prometheus-kube-prometheus-prometheus.prometheus.svc.cluster.local:9090"
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      group: gateway.networking.k8s.io
      kind: Gateway
      sectionName: web
  hostnames:
    - prometheus.home.alexnorum.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-kube-prometheus-prometheus
          group: ""
          kind: Service
          port: 9090
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: prometheus
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Alert Management
    gethomepage.dev/group: Monitoring
    gethomepage.dev/icon: alertmanager.png
    gethomepage.dev/name: Alert Manager
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=alertmanager"
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      group: gateway.networking.k8s.io
      kind: Gateway
      sectionName: web
  hostnames:
    - alertmanager.home.alexnorum.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - name: prometheus-kube-prometheus-alertmanager
          group: ""
          kind: Service
          port: 9093
          weight: 1
