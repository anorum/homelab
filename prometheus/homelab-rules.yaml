apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-rules
  namespace: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: prometheus
    release: prometheus
spec:
  groups:
    - name: homelab-node-health
      rules:
        - alert: HomelabNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not ready"
            description: "Node {{ $labels.node }} has been in a not-ready state for more than 5 minutes."

        - alert: HomelabHighCpuUsage
          expr: (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"
            description: "CPU usage on {{ $labels.instance }} has been above 85% for 10 minutes. Current value: {{ $value | humanizePercentage }}"

        - alert: HomelabHighMemoryUsage
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
            description: "Memory usage on {{ $labels.instance }} has been above 85% for 10 minutes. Current value: {{ $value | humanizePercentage }}"

    - name: homelab-disk
      rules:
        - alert: HomelabHddUsageWarning
          expr: (1 - node_filesystem_avail_bytes{mountpoint="/mnt/hd"} / node_filesystem_size_bytes{mountpoint="/mnt/hd"}) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "12TB HDD usage above 80%"
            description: "HDD at /mnt/hd on swagman-2 is {{ $value | humanizePercentage }} full."

        - alert: HomelabHddUsageCritical
          expr: (1 - node_filesystem_avail_bytes{mountpoint="/mnt/hd"} / node_filesystem_size_bytes{mountpoint="/mnt/hd"}) > 0.90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "12TB HDD usage above 90%"
            description: "HDD at /mnt/hd on swagman-2 is {{ $value | humanizePercentage }} full. Immediate attention required."

        - alert: HomelabRootDiskUsageWarning
          expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Root disk usage above 80% on {{ $labels.instance }}"
            description: "Root filesystem on {{ $labels.instance }} is {{ $value | humanizePercentage }} full."

    - name: homelab-pods
      rules:
        - alert: HomelabPodCrashLooping
          expr: kube_pod_container_status_restarts_total{namespace=~"adguard|authentik|mealie|prometheus|loki|traefik|argocd|cloudflared|homepage|open-webui|ollama|uptime-kuma"} > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value }} times in the last hour."

        - alert: HomelabPodNotReady
          expr: kube_pod_status_ready{condition="true",namespace=~"adguard|authentik|mealie|prometheus|loki|traefik|argocd|cloudflared|homepage|open-webui|ollama|uptime-kuma"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a not-ready state for more than 10 minutes."

    - name: homelab-mac-mini
      rules:
        - alert: MacMiniDataDiskWarning
          expr: (1 - node_filesystem_avail_bytes{instance="mac-mini",mountpoint="/System/Volumes/Data"} / node_filesystem_size_bytes{instance="mac-mini",mountpoint="/System/Volumes/Data"}) > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Mac Mini data disk above 85%"
            description: "Mac Mini /System/Volumes/Data is {{ $value | humanizePercentage }} full. Current usage: ~170Gi/228Gi."

        - alert: MacMiniDataDiskCritical
          expr: (1 - node_filesystem_avail_bytes{instance="mac-mini",mountpoint="/System/Volumes/Data"} / node_filesystem_size_bytes{instance="mac-mini",mountpoint="/System/Volumes/Data"}) > 0.92
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Mac Mini data disk above 92% — immediate action required"
            description: "Mac Mini /System/Volumes/Data is {{ $value | humanizePercentage }} full. Services (Ollama, OpenClaw, Paperclip) may be impacted."

        - alert: MacMiniHighCpu
          expr: (1 - avg by(instance) (rate(node_cpu_seconds_total{instance="mac-mini",mode="idle"}[5m]))) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Mac Mini CPU above 85%"
            description: "Mac Mini CPU usage has been above 85% for 10 minutes. Current value: {{ $value | humanizePercentage }}"

        - alert: MacMiniHighMemory
          expr: (1 - node_memory_MemAvailable_bytes{instance="mac-mini"} / node_memory_MemTotal_bytes{instance="mac-mini"}) > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Mac Mini memory above 90%"
            description: "Mac Mini memory usage has been above 90% for 10 minutes. Current value: {{ $value | humanizePercentage }}"

        - alert: MacMiniNodeExporterDown
          expr: up{job="mac-mini-node-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Mac Mini node_exporter is unreachable"
            description: "Prometheus cannot scrape node_exporter at 192.168.1.105:9100. Mac Mini may be down or node_exporter stopped."

    - name: homelab-home-assistant
      rules:
        - alert: HomeAssistantDown
          expr: up{job="home_assistant"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Home Assistant is down"
            description: "Prometheus cannot reach Home Assistant at 192.168.1.38:8123. It has been unreachable for more than 2 minutes."

    - name: homelab-services
      rules:
        - alert: HomelabArgoOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is out of sync"
            description: "ArgoCD application {{ $labels.name }} has been out of sync for more than 15 minutes. Sync status: {{ $labels.sync_status }}"

        - alert: HomelabArgoDegraded
          expr: argocd_app_info{health_status=~"Degraded|Missing"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is {{ $labels.health_status }}"
            description: "ArgoCD application {{ $labels.name }} has been {{ $labels.health_status }} for more than 10 minutes."

        - alert: HomelabArgoProgressing
          expr: argocd_app_info{health_status="Progressing"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} stuck Progressing"
            description: "ArgoCD application {{ $labels.name }} has been in Progressing state for more than 30 minutes — possible deployment stall or missing resource."

    - name: homelab-backup
      rules:
        - alert: HomelabBackupFailed
          expr: kube_job_status_failed{namespace="backup"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Backup job {{ $labels.job_name }} failed"
            description: "Backup CronJob {{ $labels.job_name }} in namespace backup has a failed pod. Check logs immediately."

        - alert: HomelabBackupMissing
          expr: (time() - kube_cronjob_status_last_schedule_time{namespace="backup"}) > 90000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Backup CronJob {{ $labels.cronjob }} hasn't run recently"
            description: "Backup CronJob {{ $labels.cronjob }} last ran more than 25 hours ago. Expected daily schedule may have missed."

    - name: homelab-pod-unknown
      rules:
        - alert: HomelabPodUnknown
          expr: kube_pod_status_phase{phase="Unknown",namespace!="kube-system"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is in Unknown state"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in Unknown phase for 15 minutes. The node it was on may be unreachable."
