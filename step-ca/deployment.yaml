apiVersion: apps/v1
kind: Deployment
metadata:
  name: step-ca
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: step-ca
  template:
    metadata:
      labels:
        app: step-ca
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: step-ca
          image: smallstep/step-ca:0.30.2@sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
          command: [/usr/local/bin/step-ca]
          args:
            - --password-file
            - /home/step/secrets/password
            - /home/step/config/ca.json
          ports:
            - name: https
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # The upstream binary carries this file capability, even on port 9000.
              add: [NET_BIND_SERVICE]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /home/step/config
              readOnly: true
            - name: issuer-secret
              mountPath: /home/step/secrets
              readOnly: true
            - name: database
              mountPath: /home/step/db
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: step-ca-config
        - name: issuer-secret
          secret:
            secretName: step-ca-issuer
            defaultMode: 0440
        - name: database
          persistentVolumeClaim:
            claimName: step-ca-db
        - name: temporary
          emptyDir: {}
