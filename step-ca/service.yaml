apiVersion: v1
kind: Service
metadata:
  name: step-ca
  annotations:
    metallb.universe.tf/loadBalancerIPs: "192.168.1.152"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector:
    app: step-ca
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
