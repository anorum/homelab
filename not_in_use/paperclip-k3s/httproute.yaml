apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paperclip
  namespace: paperclip
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: AI Agent Orchestration
    gethomepage.dev/group: AI
    gethomepage.dev/icon: https://avatars.githubusercontent.com/u/181789975
    gethomepage.dev/name: Paperclip
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - paperclip.home.alexnorum.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: paperclip
          port: 3100
