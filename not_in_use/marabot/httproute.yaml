apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: marabot
  namespace: marabot
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Marabot Python Application
    gethomepage.dev/group: Applications
    gethomepage.dev/icon: python.png
    gethomepage.dev/name: Marabot
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - marabot.homelab
    - mara.alexnorum.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: marabot
          port: 8000
