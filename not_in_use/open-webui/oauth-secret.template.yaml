# Plaintext template — do NOT commit this file.
# Use the SAME secret value as authentik/open-webui-oauth-secret.enc.yaml
#
# Steps:
#   SECRET=$(openssl rand -hex 32)
#   # Fill in the value below, then:
#   cp open-webui/oauth-secret.template.yaml /tmp/open-webui-oauth.yaml
#   # edit with real secret
#   cp /tmp/open-webui-oauth.yaml open-webui/oauth-secret.enc.yaml
#   sops -e -i open-webui/oauth-secret.enc.yaml
#   rm /tmp/open-webui-oauth.yaml

apiVersion: v1
kind: Secret
metadata:
  name: open-webui-oauth
  namespace: open-webui
stringData:
  OAUTH_CLIENT_ID: "open-webui"
  OAUTH_CLIENT_SECRET: "<SECRET>"
