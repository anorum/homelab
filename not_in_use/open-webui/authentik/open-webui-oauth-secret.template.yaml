# Plaintext template — do NOT commit this file.
# Steps:
#   1. Generate a secret: SECRET=$(openssl rand -hex 32)
#   2. Fill in the value below, then:
#        cp authentik/open-webui-oauth-secret.template.yaml /tmp/open-webui-oauth-secret.yaml
#        # edit with real secret
#        cp /tmp/open-webui-oauth-secret.yaml authentik/open-webui-oauth-secret.enc.yaml
#        sops -e -i authentik/open-webui-oauth-secret.enc.yaml
#        rm /tmp/open-webui-oauth-secret.yaml
#   3. Use the SAME secret value in open-webui/oauth-secret.enc.yaml

apiVersion: v1
kind: Secret
metadata:
  name: open-webui-oauth-secret
  namespace: authentik
stringData:
  clientSecret: "<SECRET>"
