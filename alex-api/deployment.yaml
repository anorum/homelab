apiVersion: apps/v1
kind: Deployment
metadata:
  name: alex-api
  namespace: alex-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alex-api
  template:
    metadata:
      labels:
        app: alex-api
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: alex-api
        image: ghcr.io/anorum/alex-api:latest
        imagePullPolicy: Always
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: alex-api-secrets
              key: OPENAI_API_KEY
        - name: SPOTIFY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: alex-api-secrets
              key: SPOTIFY_CLIENT_ID
        - name: SPOTIFY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: alex-api-secrets
              key: SPOTIFY_CLIENT_SECRET
        - name: SPOTIFY_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: alex-api-secrets
              key: SPOTIFY_REFRESH_TOKEN
        - name: STRAVA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: alex-api-secrets
              key: STRAVA_CLIENT_ID
        - name: STRAVA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: alex-api-secrets
              key: STRAVA_CLIENT_SECRET
        - name: STRAVA_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: alex-api-secrets
              key: STRAVA_ACCESS_TOKEN
        - name: STRAVA_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: alex-api-secrets
              key: STRAVA_REFRESH_TOKEN
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: alex-api-secrets
              key: API_KEY
        - name: GITHUB_PAT
          valueFrom:
            secretKeyRef:
              name: alex-api-secrets
              key: GITHUB_PAT
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
