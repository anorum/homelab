apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: alex-api

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

secretGenerator:
  - name: alex-api-secrets
    envs:
      - .env
    options:
      annotations:
        argocd.argoproj.io/sync-options: Prune=false

labels:
- pairs:
    app.kubernetes.io/name: alex-api
    app.kubernetes.io/instance: alex-api
