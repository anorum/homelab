apiVersion: apps/v1
kind: Deployment
metadata:
  name: marabot
  namespace: marabot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marabot
  template:
    metadata:
      labels:
        app: marabot
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: marabot
        image: anorum/marabot:latest
        imagePullPolicy: Always
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: marabot-secrets
              key: openai-api-key
        - name: CHAINLIT_HOST
          value: "0.0.0.0"
        - name: CHAINLIT_PORT
          value: "8000"
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 1000
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 240
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5
        resources:
          limits:
            cpu: 500m
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 128Mi
