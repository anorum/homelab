version: '3'

dotenv: ['.env']

vars:
  OLLAMA_HOST: http://192.168.1.168:11434
  OPEN_WEBUI_URL: http://chat.home.alexnorum.com

tasks:
  openwebui:build-model:
    desc: Create/update the Jarvis model on Ollama from Modelfile
    cmds:
      - |
        uv run python -c "
        import json, re
        with open('open-webui/Modelfile') as f:
            content = f.read()
        from_m = re.search(r'^FROM\s+(\S+)', content, re.MULTILINE | re.IGNORECASE)
        sys_m = re.search(r'SYSTEM\s+\"\"\"(.*?)\"\"\"', content, re.DOTALL | re.IGNORECASE)
        params = {}
        for m in re.finditer(r'^PARAMETER\s+(\w+)\s+(\S+)', content, re.MULTILINE | re.IGNORECASE):
            k, v = m.group(1), m.group(2)
            try: v = float(v) if '.' in v else int(v)
            except ValueError: pass
            params[k] = v
        payload = {
            'model': 'jarvis',
            'from': from_m.group(1) if from_m else 'qwen2.5:7b',
            'system': sys_m.group(1).strip() if sys_m else '',
            'parameters': params,
        }
        print(json.dumps(payload))
        " | curl -s {{.OLLAMA_HOST}}/api/create -d @- | uv run python -c "
        import sys, json
        for line in sys.stdin:
            data = json.loads(line)
            print(data.get('status') or data.get('error') or data)
        "

  ollama:list:
    desc: List all Ollama models
    cmds:
      - curl -s {{.OLLAMA_HOST}}/api/tags | python3 -c "import sys,json; [print(f\"  {m['name']:30s} {m['details']['parameter_size']}\") for m in json.load(sys.stdin)['models']]"

  openwebui:deploy-tools:
    desc: Deploy all Open WebUI tools via API
    cmds:
      - uv run open-webui/tools/deploy.py
    env:
      OPEN_WEBUI_URL: "{{.OPEN_WEBUI_URL}}"

  openwebui:list-tools:
    desc: List installed Open WebUI tools
    cmds:
      - |
        curl -s {{.OPEN_WEBUI_URL}}/api/v1/tools/ \
          -H "Authorization: Bearer $OPEN_WEBUI_API_KEY" \
          | python3 -c "
        import sys, json
        tools = json.load(sys.stdin)
        if not tools:
            print('  No tools installed.')
        else:
            for t in tools:
                meta = t.get('meta', {}).get('manifest', {})
                print(f\"  {t['id']:30s} v{meta.get('version', '?'):8s} {meta.get('description', '')}\")
        "
