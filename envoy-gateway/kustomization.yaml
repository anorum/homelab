apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: envoy-gateway-system

resources:
  - namespace.yaml
  - gateway.yaml

helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy/gateway-helm
    version: v1.7.0
    releaseName: envoy-gateway
    namespace: envoy-gateway-system
