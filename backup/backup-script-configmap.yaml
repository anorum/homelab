apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-script
  namespace: backup
data:
  backup.sh: |
    #!/bin/sh
    set -euo pipefail

    DATE=$(date +%Y-%m-%d)
    BUCKET="anorum-homelab"
    BACKUP_PREFIX="backups"

    echo "=== Homelab Backup - $DATE ==="

    # --- Mealie backup ---
    echo "Backing up Mealie data..."
    aws s3 sync /mnt/hd/mealie/ "s3://$BUCKET/$BACKUP_PREFIX/mealie/" \
      --delete \
      --region "$AWS_DEFAULT_REGION"
    echo "Mealie backup complete."

    # --- Authentik PostgreSQL backup ---
    echo "Backing up Authentik database..."
    kubectl exec -n authentik authentik-postgresql-0 -- \
      sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -U authentik -d authentik' \
      | aws s3 cp - "s3://$BUCKET/$BACKUP_PREFIX/authentik/$DATE.sql" \
        --region "$AWS_DEFAULT_REGION"
    echo "Authentik backup complete."

    # --- Open WebUI SQLite backup ---
    echo "Backing up Open WebUI database..."
    OW_POD=$(kubectl get pod -n open-webui -l app=open-webui -o jsonpath='{.items[0].metadata.name}')
    kubectl cp "open-webui/$OW_POD:/app/backend/data/webui.db" /tmp/webui.db
    aws s3 cp /tmp/webui.db "s3://$BUCKET/$BACKUP_PREFIX/open-webui/$DATE.db" \
      --region "$AWS_DEFAULT_REGION"
    rm -f /tmp/webui.db
    echo "Open WebUI backup complete."

    # --- Cleanup old backups (keep 7 days) ---
    echo "Cleaning up old backups..."
    CUTOFF_DATE=$(date -d "-7 days" +%Y-%m-%d 2>/dev/null || date -v-7d +%Y-%m-%d)
    for prefix in authentik open-webui; do
      aws s3 ls "s3://$BUCKET/$BACKUP_PREFIX/$prefix/" --region "$AWS_DEFAULT_REGION" \
        | awk '{print $4}' \
        | while read -r file; do
            file_date=$(echo "$file" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
            if [ -n "$file_date" ] && [ "$file_date" \< "$CUTOFF_DATE" ]; then
              echo "Deleting old backup: $prefix/$file"
              aws s3 rm "s3://$BUCKET/$BACKUP_PREFIX/$prefix/$file" --region "$AWS_DEFAULT_REGION"
            fi
          done
    done
    echo "Cleanup complete."

    echo "=== All backups completed successfully ==="
