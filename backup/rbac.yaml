apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-sa
  namespace: backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-exec
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-exec
subjects:
  - kind: ServiceAccount
    name: backup-sa
    namespace: backup
roleRef:
  kind: ClusterRole
  name: backup-exec
  apiGroup: rbac.authorization.k8s.io
