---
# A browser view of the Kafka cluster: topics, partitions, offsets, message
# contents, and consumer-group lag. Consumer lag is the one that matters most
# once the pipeline is running - it is how you tell "the detector is keeping up"
# from "the detector is falling behind", which no amount of log reading shows.
#
# kafbat/kafka-ui rather than Redpanda Console: Apache-2.0 against Redpanda's
# BSL, and it has a genuine read-only mode. Redpanda Console is Go rather than
# JVM and would use meaningfully less memory, which on these Pis is a real
# argument - but an unauthenticated page that can delete topics is the worse
# trade. Measured at 389Mi in practice, against the 640Mi limit below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      # Everything else in this namespace is anchored to swagman-2 by the HDD at
      # /mnt/hd - the broker's log directory is a local-hdd-storage PV with node
      # affinity, and it cannot move. kafka-ui has no such tie: it is stateless
      # (emptyDir only) and reaches the cluster over the bootstrap Service, so
      # the node it lands on is invisible to it. Preferring swagman-1 keeps that
      # ~390Mi off the node carrying the storage-pinned workloads.
      #
      # Preferred rather than required on purpose: if swagman-1 is down, a Kafka
      # UI that refuses to schedule is worse than one running beside the broker.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["swagman-1"]
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: blockade
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: blockade-kafka-bootstrap.kafka.svc:9092
            # Read-only. This is reachable from the whole LAN with no
            # authentication, so it can browse everything and change nothing.
            # Flip to "false" when resetting consumer-group offsets for a replay
            # - that is the one workflow this blocks, and it is deliberate that
            # turning it on is a conscious act.
            - name: KAFKA_CLUSTERS_0_READONLY
              value: "true"
            # No runtime cluster editing: the cluster list is config, and config
            # lives in git.
            - name: DYNAMIC_CONFIG_ENABLED
              value: "false"
            # Capped well below the container limit. The JVM sizes its heap from
            # the cgroup by default, which on a 512Mi limit leaves too little
            # headroom for non-heap memory and gets the pod OOMKilled rather
            # than garbage collected.
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx320m"
          # Raised from 512Mi: the 294Mi in the comment above was measured on an
          # idle cluster, and steady state with the pipeline actually running is
          # 389Mi - 76% of the old limit, which is too close for a JVM whose
          # non-heap footprint grows with the number of topics it is watching.
          resources:
            requests:
              cpu: 50m
              memory: 320Mi
            limits:
              memory: 640Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The JVM writes to /tmp, so a read-only root filesystem needs this.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka
  labels:
    app: kafka-ui
spec:
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Platform convention: services are reachable by name through the shared
# Gateway, not by NodePort. AdGuard's *.home.alexnorum.com wildcard resolves
# this to the Traefik LoadBalancer on the LAN.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafka-ui
  namespace: kafka
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Kafka topics, consumers, and lag
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: Kafka UI
    gethomepage.dev/pod-selector: "app=kafka-ui"
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - kafka.home.alexnorum.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kafka-ui
          port: 8080
