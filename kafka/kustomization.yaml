apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka

resources:
  - namespace.yaml
  - hdd-pv.yaml
  - kafka.yaml
  - kafka-ui.yaml

helmCharts:
  # Pinned to the version already running in the cluster; the chart's resource
  # names match the install-YAML deployment it replaces, so Argo adopts the
  # live operator without recreating it.
  - name: strimzi-kafka-operator
    repo: https://strimzi.io/charts/
    version: 1.1.0
    releaseName: strimzi
    namespace: kafka
    valuesInline:
      # Chart default is a 384Mi limit against a 7-day peak of 317Mi, which is
      # 82% and too close for a JVM operator that reconciles on a timer.
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 640Mi

# The Strimzi chart exposes only initialDelaySeconds and periodSeconds for its
# probes and never templates timeoutSeconds, so the effective value is the
# Kubernetes default of 1s. That is not survivable on swagman-2 under memory
# pressure - this JVM operator was restarted for missing the deadline while
# healthy - and since values cannot reach the field, it is patched directly.
patches:
  - target:
      kind: Deployment
      name: strimzi-cluster-operator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: strimzi-cluster-operator
      spec:
        template:
          spec:
            containers:
              - name: strimzi-cluster-operator
                livenessProbe:
                  timeoutSeconds: 5
                  failureThreshold: 5
                readinessProbe:
                  timeoutSeconds: 5
                  failureThreshold: 5
