---
# Single-broker Kafka in KRaft mode, sized for two 8GB Raspberry Pis.
# Shared cluster infrastructure: projects own their topics (KafkaTopic CRs in
# their own repos); this file owns the broker. The Strimzi operator comes from
# the helm chart in this directory's kustomization.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: blockade
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 50Gi
        # The HDD, not the default class. Kafka rewrites log segments constantly,
        # which on the Pi's boot flash is a wear problem rather than a capacity
        # one - and the default class also carries a Delete reclaim policy.
        class: local-hdd-storage
        # Retained on delete. Kafka here is a transport, not the archive - the
        # corpus lives in S3 - but losing the volume mid-flight would drop
        # records the outbox had already marked published.
        deleteClaim: false
  # Raised from 1400Mi: the broker's 7-day peak is 1215Mi, 87% of that ceiling.
  # The JVM heap below is fixed at 768m, so the rest is direct buffers and page
  # cache for the log segments, which grows with partition count rather than
  # staying flat. Being OOMKilled mid-append is how a transport loses records
  # the outbox has already marked published.
  resources:
    requests:
      memory: 1Gi
      cpu: 200m
    limits:
      memory: 1792Mi
  jvmOptions:
    # Deliberately small. Two nodes with ~6.7Gi free between them also have to
    # carry Flink, and an oversized heap here is memory the stream processor
    # cannot have.
    -Xms: 768m
    -Xmx: 768m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: blockade
  namespace: kafka
spec:
  kafka:
    # Pinned deliberately: an unpinned version would let an operator upgrade
    # move the broker underneath us. metadataVersion is omitted so the operator
    # picks the default matching this version rather than us hand-writing a
    # format string that has to be kept in sync.
    version: 4.2.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # One broker, so nothing can be replicated. This is a homelab tradeoff,
      # not a recommendation: production would be three brokers with RF=3. It is
      # acceptable only because Kafka is not the system of record here - every
      # record is derivable again from the frames in S3.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator:
      resources:
        requests: { memory: 256Mi, cpu: 50m }
        limits: { memory: 384Mi }
      # Strimzi gives the topic operator a startupProbe with a 135s budget,
      # which is what let it survive the cluster-wide restart storm that killed
      # its sibling. Liveness is widened anyway: the default kills a healthy JVM
      # after 30s of missed checks, and on a contended Pi that is a coin flip.
      livenessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 10
        periodSeconds: 15
        failureThreshold: 6
      readinessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 10
        periodSeconds: 15
        failureThreshold: 6
    # userOperator is deliberately absent. It exists to reconcile KafkaUser
    # resources and ACLs, and this cluster has neither: one plaintext listener
    # with no authentication, no cluster authorization, and zero KafkaUser
    # objects. It was doing nothing, and doing it expensively - unlike the topic
    # operator it gets no startupProbe from Strimzi, so its liveness check began
    # at 10s and killed it after three misses, roughly 40s for a JVM cold start.
    # It then crashlooped, and each restart burned close to a full core on the
    # node with the least to spare, which slowed the very startup being timed.
    #
    # Same reasoning as the FRR sidecars: the fix for a component with no work
    # is to remove it, not to widen the deadline it keeps missing. Restore this
    # block if the cluster ever gains authentication or a KafkaUser.
