apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie
  namespace: mealie
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Recipe Manager & Meal Planner
    gethomepage.dev/group: Home
    gethomepage.dev/icon: mealie
    gethomepage.dev/name: Mealie
spec:
  ingressClassName: nginx
  rules:
    - host: mealie.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 9000
    - host: mealie.alexnorum.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 9000
