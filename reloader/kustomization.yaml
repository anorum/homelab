apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: reloader

resources:
  - namespace.yaml

helmCharts:
  - name: reloader
    repo: https://stakater.github.io/stakater-charts
    version: 1.4.4
    releaseName: reloader
    namespace: reloader
    valuesInline:
      reloader:
        watchGlobally: false
