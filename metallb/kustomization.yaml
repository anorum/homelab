apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metallb

resources:
  - namespace.yaml
  - ips.yaml

labels:
- pairs:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/instance: metallb
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.15.3
    releaseName: metallb
    namespace: metallb
    valuesInline:
      controller:
        # Pre-existing limit, raised here: 7-day peak is 99Mi against a 100Mi
        # ceiling. This controller assigns the LoadBalancer addresses, so it is
        # a poor candidate for being OOMKilled at a random moment.
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        livenessProbe:
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          timeoutSeconds: 5
          failureThreshold: 5
      speaker:
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 50m
            memory: 50Mi
        # FRR off: this cluster advertises purely over L2. metallb/ips.yaml
        # declares one IPAddressPool and one L2Advertisement, and there is no
        # BGPPeer or BGPAdvertisement anywhere in the cluster, so the three FRR
        # sidecars (frr, reloader, frr-metrics) ran a routing daemon with no
        # routes to speak. They were also the single worst casualty of
        # swagman-2's memory pressure: frr alone was killed 13 times in 24h
        # after the streaming pipeline landed, not because FRR was unhealthy -
        # its own logs show all daemons up and config read in 0s - but because
        # the node stalled long enough for a 1s liveness probe to time out.
        #
        # Deleting them removes three containers per node, and with them the
        # probe that was doing the killing.
        frr:
          enabled: false
        # Probe timeouts. The chart ships timeoutSeconds: 1 on the speaker's
        # liveness and readiness probes, which is optimistic for a Raspberry Pi
        # that also hosts the HDD workloads: when swagman-2 goes into reclaim,
        # a 1s HTTP deadline is missed by processes that are merely slow rather
        # than broken, and failureThreshold: 3 then restarts a healthy speaker.
        # Restarting the pod that announces the Traefik VIP is a real outage,
        # so the deadline should be generous.
        livenessProbe:
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          timeoutSeconds: 5
          failureThreshold: 5
