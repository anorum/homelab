apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metallb

resources:
  - namespace.yaml
  - ips.yaml

labels:
- pairs:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/instance: metallb
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.15.3
    releaseName: metallb
    namespace: metallb
    valuesInline:
      controller:
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 50m
            memory: 50Mi
      speaker:
        resources:
          limits:
            cpu: 100m
            memory: 100Mi
          requests:
            cpu: 50m
            memory: 50Mi
        # The speaker pod carries three FRR sidecars beyond the `speaker`
        # container itself, and only that one container was accounted for.
        #
        # This cluster runs MetalLB in L2 mode, so FRR does no work here - the
        # honest fix is `frr.enabled: false`, which deletes all three. That is
        # deliberately not done in this change: every LoadBalancer address,
        # including the Traefik VIP that fronts the whole cluster, is announced
        # by this DaemonSet, so flipping its mode belongs in its own change with
        # someone watching. Bounding them is the safe half.
        frr:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        reloader:
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
        frrMetrics:
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
