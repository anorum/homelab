apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-blueprint
  namespace: authentik
data:
  argocd.yaml: |
    version: 1
    metadata:
      name: ArgoCD OAuth2 Provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      argocd_client_id: LBwcFRMLl834aRtkJ1uXD0s0i2AU5VdMKcy5qPv0
      argocd_client_secret: !Env ARGOCD_OAUTH_CLIENT_SECRET
    entries:
      # Create the OAuth2 Provider for ArgoCD
      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        state: present
        identifiers:
          name: ArgoCD
        attrs:
          # Use the default implicit consent flow
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          # Use the default invalidation flow for logout
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # Use the internal JWT certificate for RS256 signing (required by Dex)
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Internal JWT Certificate]]
          client_id: !Context argocd_client_id
          client_secret: !Context argocd_client_secret
          client_type: confidential
          # redirect_uris - allow both http/https and different callback paths
          redirect_uris:
            - url: https://argo.alexnorum.com/api/dex/callback
              matching_mode: strict
            - url: http://argo.alexnorum.com/api/dex/callback
              matching_mode: strict
            - url: https://argo.alexnorum.com/auth/callback
              matching_mode: strict
            - url: http://argo.alexnorum.com/auth/callback
              matching_mode: strict
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          # Property mappings for scopes (openid, email, profile)
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      # Create the ArgoCD Application
      - model: authentik_core.application
        state: present
        identifiers:
          slug: argo-cd
        attrs:
          name: ArgoCD
          provider: !KeyOf argocd-provider
          meta_launch_url: https://argo.alexnorum.com
          policy_engine_mode: any

      # ArgoCD Admin Group
      - model: authentik_core.group
        state: present
        identifiers:
          name: ArgoCD Admins
        attrs:
          is_superuser: false

      # ArgoCD Viewer Group
      - model: authentik_core.group
        state: present
        identifiers:
          name: ArgoCD Viewers
        attrs:
          is_superuser: false
