apiVersion: v1
kind: ConfigMap
metadata:
  name: forward-auth-blueprint
  namespace: authentik
data:
  forward-auth.yaml: |
    version: 1
    metadata:
      name: Homelab Forward Auth
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Proxy Provider in forward_domain mode for *.home.alexnorum.com
      - model: authentik_providers_proxy.proxyprovider
        id: homelab-forward-auth-provider
        state: present
        identifiers:
          name: Homelab Forward Auth
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_domain
          cookie_domain: home.alexnorum.com
          external_host: http://grafana.home.alexnorum.com
          access_token_validity: hours=24

      # Application linked to the proxy provider
      - model: authentik_core.application
        state: present
        identifiers:
          slug: homelab-internal
        attrs:
          name: Homelab Internal
          provider: !KeyOf homelab-forward-auth-provider
          meta_launch_url: http://grafana.home.alexnorum.com
          policy_engine_mode: any
