apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik
resources:
- namespace.yaml
- postgres-pv.yaml

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: 2025.6.1
    releaseName: authentik
    namespace: authentik
    includeCRDs: true
    valuesFile: values.yaml