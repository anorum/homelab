apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik
resources:
- namespace.yaml
- httproute.yaml
- argocd-blueprint.yaml
- google-oauth-blueprint.yaml
- forward-auth-blueprint.yaml
- grafana-blueprint.yaml
- open-webui-blueprint.yaml

generators:
- secret-generator.yaml
- google-oauth-secret-generator.yaml
- grafana-oauth-secret-generator.yaml
- open-webui-oauth-secret-generator.yaml

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: 2026.2.1
    releaseName: authentik
    namespace: authentik
    includeCRDs: true
    valuesFile: values.yaml