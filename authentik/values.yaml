global:
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: secret_key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: postgresql-password
    - name: AUTHENTIK_HOST
      value: "https://sso.alexnorum.com"
    - name: AUTHENTIK_HOST_BROWSER
      value: "https://sso.alexnorum.com"
    - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
      value: "true"
    # Trust X-Forwarded headers from proxy
    - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
      value: "0.0.0.0/0"

authentik:
  secret_key: env://AUTHENTIK_SECRET_KEY
  error_reporting:
    enabled: false
  # Override the detected URL for browser API calls
  host: https://sso.alexnorum.com
  host_browser: https://sso.alexnorum.com

  postgresql:
    host: "{{ .Release.Name }}-postgresql"
    name: "authentik"
    user: "authentik"
    port: 5432

blueprints:
  configMaps:
    - argocd-blueprint
    - google-oauth-blueprint
    - forward-auth-blueprint

server:
  containerPorts:
    https: 9000
  env:
   - name: TMPDIR
     value: /tmp
  ingress:
    enabled: false
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 512Mi

worker:
  env:
    - name: TMPDIR
      value: /tmp
    - name: ARGOCD_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: argocd-oauth-secret
          key: clientSecret
    - name: GOOGLE_OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: google-oauth-secret
          key: clientId
    - name: GOOGLE_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: google-oauth-secret
          key: clientSecret
  livenessProbe:
    initialDelaySeconds: 180
  readinessProbe:
    initialDelaySeconds: 180
  startupProbe:
    initialDelaySeconds: 180
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi

redis:
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: library/redis
    tag: "8.0-bookworm"
  auth:
    enabled: false
  master:
    resources:
      limits:
        cpu: 250m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: library/postgres
    tag: "17.7-bookworm"
  primary:
    persistence:
      enabled: true
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  auth:
    username: authentik
    database: authentik
    existingSecret: authentik-secrets
    secretKeys:
      adminPasswordKey: postgresql-password
      userPasswordKey: postgresql-password
