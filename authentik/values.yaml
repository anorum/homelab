global:
    # Use environment variables from a secret for configuration
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: secret_key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: postgresql-password
    - name: AUTHENTIK_REDIS__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: redis-password
authentik:
  secret_key: env://AUTHENTIK_SECRET_KEY
  envFrom:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: secret_key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: postgresql-password
    - name: AUTHENTIK_REDIS__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: redis-password
  # This sends anonymous usage-data, stack traces on errors and
  # performance data to sentry.io, and is fully opt-in
  error_reporting:
    enabled: false
    
  # Set theme preference to dark mode
  # Options: light, dark, automatic (follows browser preference)
  theme: dark

  postgresql:
    # PostgreSQL Database host
    host: "{{ .Release.Name }}-postgresql"
    # PostgreSQL Database name
    name: "authentik"
    # PostgreSQL Database user
    user: "authentik"
    port: 5432

server:
  containerPorts:
    https: 9000
  env:
   - name: TMPDIR
     value: /tmp
  ingress:
    enabled: false
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 512Mi

worker:
  env:
    - name: TMPDIR
      value: /tmp
  livenessProbe:
    initialDelaySeconds: 180
  readinessProbe:
    initialDelaySeconds: 180
  
  startupProbe:
    initialDelaySeconds: 180

  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi

postgresql:
  enabled: true
  image:
    tag: 17.4.0-debian-12-r0
  primary:
    persistence:
      enabled: true
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  auth:
    username: authentik
    database: authentik
    existingSecret: authentik-secrets
    secretKeys:
      adminPasswordKey: postgresql-password
      userPasswordKey: postgresql-password
      replicationPasswordKey: postgresql-password
redis:
  enabled: true
  image:
    tag: 7.4.2-debian-12-r0
  auth:
    enabled: true
    existingSecret: authentik-secrets
    existingSecretPasswordKey: redis-password
  master:
    resources:
      limits:
        cpu: 300m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
