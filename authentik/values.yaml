global:
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: secret_key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-secrets
          key: postgresql-password
    - name: AUTHENTIK_HOST
      value: "https://sso.alexnorum.com"
    - name: AUTHENTIK_HOST_BROWSER
      value: "https://sso.alexnorum.com"
    - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
      value: "true"
    # Trust X-Forwarded headers from proxy
    - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
      value: "0.0.0.0/0"

authentik:
  secret_key: env://AUTHENTIK_SECRET_KEY
  error_reporting:
    enabled: false
  # Override the detected URL for browser API calls
  host: https://sso.alexnorum.com
  host_browser: https://sso.alexnorum.com

  postgresql:
    host: "{{ .Release.Name }}-postgresql"
    name: "authentik"
    user: "authentik"
    port: 5432

blueprints:
  configMaps:
    - argocd-blueprint
    - google-oauth-blueprint
    - forward-auth-blueprint
    - grafana-blueprint

server:
  containerPorts:
    https: 9000
  env:
   - name: TMPDIR
     value: /tmp
  ingress:
    enabled: false
  # 2Gi was a guess made before there was anything to measure, but the first
  # attempt to correct it read a single instantaneous 570Mi and cut to 1Gi -
  # which would have OOMKilled the SSO server, and with it login for Grafana
  # and ArgoCD. Over 7 days this container sawtooths between 491Mi and 893Mi as
  # its workers recycle; the trough is what a spot check happens to catch.
  # 1536Mi clears the real peak with room, and still returns half a gigabyte of
  # declared headroom over the original guess.
  resources:
    limits:
      cpu: 1000m
      memory: 1536Mi
    requests:
      cpu: 200m
      memory: 640Mi

worker:
  podAnnotations:
    reloader.stakater.com/auto: "true"
  env:
    - name: TMPDIR
      value: /tmp
    - name: ARGOCD_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: argocd-oauth-secret
          key: clientSecret
    - name: GOOGLE_OAUTH_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: google-oauth-secret
          key: clientId
    - name: GOOGLE_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: google-oauth-secret
          key: clientSecret
    - name: GRAFANA_OAUTH_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: grafana-oauth-secret
          key: clientSecret
  livenessProbe:
    initialDelaySeconds: 180
    failureThreshold: 5
    timeoutSeconds: 5
  readinessProbe:
    initialDelaySeconds: 180
    failureThreshold: 5
    timeoutSeconds: 5
    periodSeconds: 20
  startupProbe:
    initialDelaySeconds: 180
    failureThreshold: 10
    timeoutSeconds: 5
  # Same reasoning as the server above, but the worker's 7-day peak is 596Mi
  # rather than 893Mi, so 1Gi genuinely does clear it.
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi

postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: library/postgres
    tag: "17.7-bookworm"
  primary:
    persistence:
      enabled: true
    # Pre-existing limit, raised here because the 7-day peak is 481Mi against a
    # 512Mi ceiling - 94% of the limit, and Postgres growing its shared buffers
    # under load is normal rather than a fault. This is the identity store for
    # the whole cluster; it should not be the first thing the OOM killer finds.
    resources:
      limits:
        cpu: 500m
        memory: 768Mi
      requests:
        cpu: 100m
        memory: 320Mi
  auth:
    username: authentik
    database: authentik
    existingSecret: authentik-secrets
    secretKeys:
      adminPasswordKey: postgresql-password
      userPasswordKey: postgresql-password
