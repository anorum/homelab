apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-blueprint
  namespace: authentik
data:
  grafana.yaml: |
    version: 1
    metadata:
      name: Grafana OAuth2 Provider
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      grafana_client_id: mfRJRhWtDBQztXT9o-bS-j0zPYZEKCuAMvycoFsi
      grafana_client_secret: !Env GRAFANA_OAUTH_CLIENT_SECRET
    entries:
      # Create the OAuth2 Provider for Grafana
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        state: present
        identifiers:
          name: Grafana
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Internal JWT Certificate]]
          client_id: !Context grafana_client_id
          client_secret: !Context grafana_client_secret
          client_type: confidential
          redirect_uris:
            - url: http://grafana.home.alexnorum.com/login/generic_oauth
              matching_mode: strict
          include_claims_in_id_token: true
          sub_mode: hashed_user_id
          issuer_mode: per_provider
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

      # Create the Grafana Application
      - model: authentik_core.application
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf grafana-provider
          meta_launch_url: http://grafana.home.alexnorum.com
          policy_engine_mode: any
