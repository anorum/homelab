apiVersion: v1
kind: PersistentVolume
metadata:
  name: authentik-postgresql-pv
spec:
  capacity:
    storage: 8Gi  # Adjust size as needed for your PostgreSQL data
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-ssd-storage
  local:
    path: /mnt/ssd/authentik-postgresql  # This path needs to exist on your node
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - cluster  # Replace this with your actual node hostname if different
