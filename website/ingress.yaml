apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alex-website-ingress
  namespace: alex-website
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: alexnorum.homelab
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alex-website
            port:
              number: 80
