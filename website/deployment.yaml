apiVersion: apps/v1
kind: Deployment
metadata:
  name: alex-website
  namespace: alex-website
  labels:
    app: alex-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alex-website
  template:
    metadata:
      labels:
        app: alex-website
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: alex-website
        image: ghcr.io/anorum/alex-website:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4321
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 4321
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 4321
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: API_BASE_URL
          value: "http://alex-api.alex-api.svc.cluster.local:8000"
        - name: MARABOT_URL
          value: "http://marabot.marabot.svc.cluster.local:8000"
        - name: ALEX_API_KEY
          valueFrom:
            secretKeyRef:
              name: alex-website-secrets
              key: ALEX_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: alex-website
  namespace: alex-website
spec:
  selector:
    app: alex-website
  ports:
  - port: 80
    targetPort: 4321
  type: ClusterIP
