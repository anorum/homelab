apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No global namespace transformer: the chart renders RBAC into each watch
# namespace (a Role in blockade as well as flink), and a blanket namespace
# rewrite would collapse those into one namespace and collide.

resources:
  - namespace.yaml

helmCharts:
  - name: flink-kubernetes-operator
    repo: https://downloads.apache.org/flink/flink-kubernetes-operator-1.13.0/
    version: 1.13.0
    releaseName: flink-kubernetes-operator
    namespace: flink
    valuesInline:
      # The admission webhook needs cert-manager, which this cluster does not
      # run. It only provides earlier validation than the operator's reconcile
      # loop already performs.
      webhook:
        create: false
      # Projects run their FlinkDeployments in their own namespaces; list them
      # here. Scoped rather than cluster-wide RBAC.
      watchNamespaces:
        - blockade
      # The chart ships no resources, and this is a JVM: measured at 424Mi on
      # swagman-2, which made it the largest undeclared consumer on the node.
      # The operator's footprint tracks the number of FlinkDeployments it
      # reconciles, and there is exactly one, so 768Mi is generous.
      operatorPod:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 768Mi
      # A JVM answering an HTTP health check inside 1s on a Pi under memory
      # pressure is not a safe assumption; this operator was restarted twice in
      # the last day for missing that deadline while healthy.
      operatorHealth:
        port: 8085
        livenessProbe:
          timeoutSeconds: 5
          failureThreshold: 5
          periodSeconds: 10
          initialDelaySeconds: 30
        startupProbe:
          timeoutSeconds: 5
          failureThreshold: 30
          periodSeconds: 10
