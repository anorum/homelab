apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedding-website
  namespace: wedding-website
  labels:
    app: wedding-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wedding-website
  template:
    metadata:
      labels:
        app: wedding-website
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: wedding-website
        image: ghcr.io/anorum/wedding-website:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: REACT_APP_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: wedding-website-secrets
              key: REACT_APP_OPENAI_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: wedding-website
  namespace: wedding-website
spec:
  selector:
    app: wedding-website
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP