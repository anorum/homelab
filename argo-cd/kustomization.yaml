apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

patches:
- target:
    kind: Deployment
    name: argocd-server
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
- target:
    kind: Deployment
    name: argocd-repo-server
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
- target:
    kind: StatefulSet
    name: argocd-application-controller
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
- path: ksops-patch.yaml
  target:
    kind: Deployment
    name: argocd-repo-server

resources:
- namespace.yaml
- https://raw.githubusercontent.com/argoproj/argo-cd/v3.3.2/manifests/install.yaml
- httproute.yaml
- app-of-apps.yaml
- servicemonitors.yaml

configMapGenerator:
  - name: argocd-cm
    behavior: merge
    literals:
      - kustomize.buildOptions=--enable-helm --enable-alpha-plugins --enable-exec
      - accounts.readonly=apiKey
      - accounts.jarvis=apiKey
      - url=https://argo.home.alexnorum.com
      - application.instanceLabelKey=argocd.argoproj.io/instance
      - timeout.reconciliation=180s
  - name: argocd-rbac-cm
    behavior: merge
    literals:
      - policy.default=role:admin
  - name: argocd-cmd-params-cm
    behavior: merge
    literals:
      - server.insecure=true
      - exec.enabled=true
      - server.disable.auth=true
