apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

patches:
- target:
    kind: Deployment
    name: argocd-server
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
- target:
    kind: Deployment
    name: argocd-repo-server
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
- target:
    kind: StatefulSet
    name: argocd-application-controller
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
- path: ksops-patch.yaml
  target:
    kind: Deployment
    name: argocd-repo-server

resources:
- namespace.yaml
- https://raw.githubusercontent.com/argoproj/argo-cd/v2.7.2/manifests/install.yaml
- ingress.yaml

configMapGenerator:
  - name: argocd-cm
    behavior: merge
    literals:
      - kustomize.buildOptions=--enable-helm --enable-alpha-plugins --enable-exec
      - accounts.readonly=apiKey
      - url=https://argo.alexnorum.com
      - admin.enabled=false
      - application.instanceLabelKey=argocd.argoproj.io/instance
      - timeout.reconciliation=180s
      - exec.enabled=true
      - "dex.config=connectors:\n  - type: oidc\n    id: authentik\n    name: authentik\n    config:\n      issuer: https://sso.alexnorum.com/application/o/argo-cd/\n      clientID: LBwcFRMLl834aRtkJ1uXD0s0i2AU5VdMKcy5qPv0\n      clientSecret: $dex.authentik.clientSecret\n      insecureEnableGroups: true\n      scopes:\n        - openid\n        - profile\n        - email\n        - groups"
  - name: argocd-rbac-cm
    behavior: merge
    literals:
      - policy.default=role:admin
      - "policy.csv=g, readonly, role:readonly\ng, ArgoCD Admins, role:admin\ng, ArgoCD Viewers, role:readonly\ng, authentik:ArgoCD Admins, role:admin\ng, authentik:ArgoCD Viewers, role:readonly\ng, authentik:ArgoCD-Admins, role:admin\ng, authentik:ArgoCD-Viewers, role:readonly\ng, ArgoCD-Admins, role:admin\ng, ArgoCD-Viewers, role:readonly\ng, authentik Admins, role:admin\ng, anorum, role:admin\np, role:org-admin, applications, *, */*, allow\np, role:org-admin, clusters, get, *, allow\np, role:org-admin, repositories, get, *, allow\np, role:org-admin, repositories, create, *, allow\np, role:org-admin, repositories, update, *, allow\np, role:org-admin, repositories, delete, *, allow"