apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

patches:
- target:
    kind: Deployment
    name: argocd-server
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
- target:
    kind: Deployment
    name: argocd-repo-server
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
- target:
    kind: StatefulSet
    name: argocd-application-controller
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 2

resources:
- namespace.yaml
- https://raw.githubusercontent.com/argoproj/argo-cd/v2.7.2/manifests/install.yaml
- ingress.yaml
- sealed-repo-secrets.yaml
- sealed-oidc-secret.yaml

configMapGenerator:
  - name: argocd-cm
    behavior: merge
    literals:
      - kustomize.buildOptions=--enable-helm
      - accounts.readonly=apiKey
      - "dex.config=connectors:\n  - type: oidc\n    id: authentik\n    name: authentik\n    config:\n      issuer: https://sso.alexnorum.com/application/o/argocd/\n      clientID: LBwcFRMLl834aRtkJ1uXD0s0i2AU5VdMKcy5qPv0\n      clientSecret: $dex.authentik.clientSecret\n      insecureEnableGroups: true\n      scopes:\n        - openid\n        - profile\n        - email"
  - name: argocd-rbac-cm
    behavior: merge
    literals:
      - policy.csv="g, readonly, role:readonly\ng, ArgoCD Admins, role:admin\ng, ArgoCD Viewers, role:readonly"
