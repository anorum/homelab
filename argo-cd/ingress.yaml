apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-cd-ui
  annotations:
    ingress.kubernetes.io/proxy-body-size: 100M
    ingress.kubernetes.io/app-root: "/"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: GitOps Deployment
    gethomepage.dev/group: Development
    gethomepage.dev/name: Argo CD
    gethomepage.dev/widget.type: "argocd"
    gethomepage.dev/widget.url: "http://argocd-server.argocd.svc.cluster.local"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=argocd-server"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_ARGOCD_KEY}}"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - argo.homelab
    secretName: argocd-secret
  rules:
  - host: argo.homelab
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: argocd-server
            port:
              name: https
