- name: Deploy Docker Compose services on Mac Mini
  hosts: mac_mini
  gather_facts: false
  vars:
    compose_dir: "{{ playbook_dir }}/../../mac-mini"
  tasks:
    - name: Ensure Docker is running
      command: docker info
      changed_when: false

    - name: Deploy compose stack
      command: docker compose up -d
      args:
        chdir: "{{ compose_dir }}"
      register: compose_result
      changed_when: "'Started' in compose_result.stderr or 'Created' in compose_result.stderr"

    - name: Show running containers
      command: docker compose ps
      args:
        chdir: "{{ compose_dir }}"
      changed_when: false
      register: ps_result

    - name: Display status
      debug:
        msg: "{{ ps_result.stdout_lines }}"

- name: Deploy homelab-mcp as native LaunchAgent
  hosts: mac_mini
  gather_facts: false
  vars:
    plist_src: "{{ playbook_dir }}/../../mac-mini/com.homelab.mcp.plist"
    plist_dest: "/Users/alexnorum/Library/LaunchAgents/com.homelab.mcp.plist"
    run_sh: "/Users/alexnorum/repos/homelab/mac-mini/mcp-server/run.sh"
  tasks:
    - name: Make run.sh executable
      file:
        path: "{{ run_sh }}"
        mode: "0755"

    - name: Install LaunchAgent plist
      copy:
        src: "{{ plist_src }}"
        dest: "{{ plist_dest }}"
        mode: "0644"
      register: plist_changed

    - name: Unload existing LaunchAgent (if running)
      command: launchctl unload "{{ plist_dest }}"
      ignore_errors: true
      when: plist_changed.changed

    - name: Load LaunchAgent
      command: launchctl load "{{ plist_dest }}"
      when: plist_changed.changed

    - name: Ensure LaunchAgent is running
      command: launchctl list com.homelab.mcp
      register: lctl
      changed_when: false
      failed_when: lctl.rc != 0

    - name: Show LaunchAgent status
      debug:
        msg: "{{ lctl.stdout }}"
