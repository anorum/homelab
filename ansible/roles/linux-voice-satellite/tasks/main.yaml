---
# ── System prerequisites ──────────────────────────────────────────────────────
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install system dependencies
  apt:
    name:
      - git
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - alsa-utils
      - libsndfile1
      - libportaudio2
      - portaudio19-dev
      - pipewire
      - pipewire-pulse
      - wireplumber
      - flac
      - ffmpeg
      - libmpv-dev
      - libmpv2
    state: present

# ── SPI (for ReSpeaker APA102 LEDs) ──────────────────────────────────────────
- name: Enable SPI in /boot/firmware/config.txt
  lineinfile:
    path: /boot/firmware/config.txt
    line: 'dtparam=spi=on'
    regexp: '^#?dtparam=spi='
    state: present
  register: spi_config

# ── ReSpeaker 2-Mic HAT driver ───────────────────────────────────────────────
- name: Clone wyoming-satellite repository (needed for driver script)
  git:
    repo: https://github.com/rhasspy/wyoming-satellite.git
    dest: /opt/wyoming-satellite
    version: master
    depth: 1

- name: Check if seeed-voicecard DKMS module is already registered
  stat:
    path: /var/lib/dkms/seeed-voicecard
  register: seeed_installed

- name: Run official wyoming-satellite ReSpeaker driver install script
  command: bash /opt/wyoming-satellite/etc/install-respeaker-drivers.sh
  when: not seeed_installed.stat.exists
  register: seeed_install_result

- name: Reboot after driver install (activates seeed-voicecard + SPI if changed)
  reboot:
    reboot_timeout: 300
  when: seeed_install_result is changed or spi_config is changed

# ── Verify audio device is present ───────────────────────────────────────────
- name: Verify ReSpeaker audio card is present
  command: aplay -l
  register: aplay_output
  changed_when: false
  failed_when: "'seeed2micvoicec' not in aplay_output.stdout"

# ── Set ReSpeaker as default ALSA device ─────────────────────────────────────
- name: Set ReSpeaker as default ALSA device (system-wide)
  copy:
    dest: /etc/asound.conf
    mode: '0644'
    content: |
      defaults.pcm.card 1
      defaults.ctl.card 1

- name: Set ReSpeaker as default ALSA device (user)
  copy:
    dest: /home/anorum/.asoundrc
    owner: anorum
    group: anorum
    mode: '0644'
    content: |
      defaults.pcm.card 1
      defaults.ctl.card 1

# ── PipeWire user session ─────────────────────────────────────────────────────
- name: Enable linger for anorum (start user services on boot without login)
  command: loginctl enable-linger anorum
  args:
    creates: /var/lib/systemd/linger/anorum

- name: Mask standalone PulseAudio (PipeWire provides pulse compat instead)
  systemd:
    name: pulseaudio
    state: stopped
    masked: yes
    scope: user
  become: yes
  become_user: anorum

- name: Start pipewire-pulse (PipeWire's PulseAudio compatibility layer)
  systemd:
    name: pipewire-pulse
    state: started
    enabled: yes
    scope: user
  become: yes
  become_user: anorum

# ── Set ALSA mixer levels ─────────────────────────────────────────────────────
- name: Set ReSpeaker headphone volume to 80%
  command: amixer -c 1 sset 'Headphone' 80%,80%
  changed_when: false

- name: Enable headphone zero-crossing
  command: amixer -c 1 sset 'Headphone Playback ZC' on
  changed_when: false

- name: Save ALSA mixer state
  command: alsactl store
  changed_when: false

# ── linux-voice-assistant ─────────────────────────────────────────────────────
- name: Clone linux-voice-assistant repository
  git:
    repo: https://github.com/OHF-Voice/linux-voice-assistant.git
    dest: /opt/linux-voice-assistant
    version: HEAD
    depth: 1
    force: yes  # overwrite any local manual edits — Ansible is the source of truth

- name: Patch satellite.py to advertise SPEAKER feature flag (enables media_player entity in HA)
  replace:
    path: /opt/linux-voice-assistant/linux_voice_assistant/satellite.py
    regexp: 'VoiceAssistantFeature\.TIMERS(?!\s*\|)'
    replace: 'VoiceAssistantFeature.TIMERS | VoiceAssistantFeature.SPEAKER'
  register: media_player_patch

- name: Set ownership of linux-voice-assistant to anorum
  file:
    path: /opt/linux-voice-assistant
    owner: anorum
    group: anorum
    recurse: yes

- name: Create linux-voice-assistant venv
  command: python3 -m venv /opt/linux-voice-assistant/.venv
  args:
    creates: /opt/linux-voice-assistant/.venv/bin/python

- name: Install linux-voice-assistant package
  pip:
    name: /opt/linux-voice-assistant
    virtualenv: /opt/linux-voice-assistant/.venv
    editable: yes

# ── systemd service ───────────────────────────────────────────────────────────
- name: Install linux-voice-assistant systemd service
  template:
    src: linux-voice-assistant.service.j2
    dest: /etc/systemd/system/linux-voice-assistant.service
    mode: '0644'
  register: lva_service

- name: Enable and start linux-voice-assistant
  systemd:
    name: linux-voice-assistant
    state: started
    enabled: yes
    daemon_reload: yes

# ── apa102-pi (APA102 LED driver) ────────────────────────────────────────────
# Must be installed as root into the venv because lva-leds.service runs as root
# for SPI access (/dev/spidev0.0 requires root without udev rule)
- name: Install apa102-pi into venv (required by LED service running as root)
  pip:
    name: apa102-pi
    executable: /opt/linux-voice-assistant/.venv/bin/pip

# ── Stop word sensitivity ─────────────────────────────────────────────────────
- name: Deploy stop.json with lower probability threshold
  copy:
    src: stop.json
    dest: /opt/linux-voice-assistant/wakewords/stop.json
    mode: '0644'
  register: stop_json

- name: Restart linux-voice-assistant if service file or stop.json changed
  systemd:
    name: linux-voice-assistant
    state: restarted
    daemon_reload: yes
  when: lva_service.changed or stop_json.changed or media_player_patch.changed

# ── LED companion script + service ───────────────────────────────────────────
- name: Deploy lva-leds.py
  copy:
    src: lva-leds.py
    dest: /opt/lva-leds.py
    mode: '0755'
  register: lva_leds_script

- name: Install lva-leds systemd service
  template:
    src: lva-leds.service.j2
    dest: /etc/systemd/system/lva-leds.service
    mode: '0644'
  register: lva_leds_service

- name: Enable and start lva-leds
  systemd:
    name: lva-leds
    state: started
    enabled: yes
    daemon_reload: yes

- name: Restart lva-leds if script or service file changed
  systemd:
    name: lva-leds
    state: restarted
    daemon_reload: yes
  when: lva_leds_script.changed or lva_leds_service.changed
