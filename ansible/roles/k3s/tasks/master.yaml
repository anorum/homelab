- name: Check if k3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Uninstall existing k3s server if requested
  shell: /usr/local/bin/k3s-uninstall.sh
  when: k3s_binary.stat.exists and (force_reinstall | default(false))
  ignore_errors: true

- name: Install k3s on master
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --disable=traefik,servicelb" sh
  register: k3s_master_install
  failed_when: k3s_master_install.rc != 0
  when: not k3s_binary.stat.exists or (force_reinstall | default(false))

- name: Ensure k3s config directory exists
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

- name: Configure k3s server (disable traefik and servicelb)
  copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      disable:
        - traefik
        - servicelb
    mode: '0644'
  register: k3s_config

- name: Restart k3s if config changed
  systemd:
    name: k3s
    state: restarted
  when: k3s_config.changed

- name: Wait for k3s to be ready
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    state: present
    delay: 10
    timeout: 300

- name: Wait for k3s node to be ready
  shell: k3s kubectl get nodes --no-headers | grep -w Ready
  register: k3s_ready
  retries: 30
  delay: 10
  until: k3s_ready.rc == 0

- name: Clean up traefik resources if still present
  shell: |
    k3s kubectl delete helmchart traefik traefik-crd -n kube-system 2>/dev/null || true
    k3s kubectl delete deployment traefik -n kube-system 2>/dev/null || true
    k3s kubectl delete svc traefik -n kube-system 2>/dev/null || true
    k3s kubectl delete daemonset -l app.kubernetes.io/name=traefik -n kube-system 2>/dev/null || true
  changed_when: false

- name: Retrieve k3s token
  shell: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  become: true
  run_once: true

- name: Set token fact
  set_fact:
    k3s_token: "{{ k3s_token.stdout }}"

- name: Check if config.txt exists (Pi 5)
  stat:
    path: /boot/firmware/config.txt
  register: firmware_config

- name: Check if PCIe settings exist
  command: grep -E "dtparam=(pciex1|nvme|pciex1_gen=3)" /boot/firmware/config.txt
  register: pcie_check
  changed_when: false
  failed_when: false
  when: firmware_config.stat.exists

- name: Add PCIe settings comment
  lineinfile:
    path: /boot/firmware/config.txt
    line: "# Enable the PCIe External connector."
  when: firmware_config.stat.exists and (pcie_check.rc | default(1)) != 0

- name: Enable PCIe connector
  lineinfile:
    path: /boot/firmware/config.txt
    line: "dtparam=pciex1"
  when: firmware_config.stat.exists and (pcie_check.rc | default(1)) != 0
  register: pcie_modified

- name: Enable NVME
  lineinfile:
    path: /boot/firmware/config.txt
    line: "dtparam=nvme"
  when: firmware_config.stat.exists and (pcie_check.rc | default(1)) != 0
  register: nvme_modified

- name: Enable PCIe Gen 3.0 speed
  lineinfile:
    path: /boot/firmware/config.txt
    line: "dtparam=pciex1_gen=3"
  when: firmware_config.stat.exists and (pcie_check.rc | default(1)) != 0
  register: pcie_gen_modified

- name: Check current EEPROM config
  command: rpi-eeprom-config
  register: eeprom_config
  changed_when: false
  failed_when: false

- name: Configure PSU max current in EEPROM
  shell: |
    CURRENT_CONFIG=$(rpi-eeprom-config)
    echo "${CURRENT_CONFIG}" > /tmp/eeprom-config.txt
    echo "PSU_MAX_CURRENT=5000" >> /tmp/eeprom-config.txt
    rpi-eeprom-config --config /tmp/eeprom-config.txt
    rm -f /tmp/eeprom-config.txt
  when: eeprom_config.rc == 0 and "'PSU_MAX_CURRENT=5000' not in eeprom_config.stdout"
  register: eeprom_modified

- name: Reboot if hardware config was modified
  reboot:
    reboot_timeout: 300
  when: (pcie_modified.changed | default(false)) or
        (nvme_modified.changed | default(false)) or
        (pcie_gen_modified.changed | default(false)) or
        (eeprom_modified.changed | default(false))
