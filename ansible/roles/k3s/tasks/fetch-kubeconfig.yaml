- name: Read kubeconfig from master
  slurp:
    path: /etc/rancher/k3s/k3s.yaml
  register: kubeconfig_raw

- name: Save kubeconfig locally
  become: false
  local_action:
    module: copy
    content: "{{ kubeconfig_raw.content | b64decode | replace('127.0.0.1', hostvars[groups['masters'][0]]['ansible_host']) }}"
    dest: "{{ lookup('env', 'HOME') }}/.kube/config-homelab"
    mode: '0600'

- name: Print kubeconfig instructions
  debug:
    msg: |
      Kubeconfig saved to ~/.kube/config-homelab
      To use: export KUBECONFIG=~/.kube/config-homelab
      Or merge into ~/.kube/config
