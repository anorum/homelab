- name: Check if k3s agent is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Uninstall existing k3s agent if present
  shell: /usr/local/bin/k3s-agent-uninstall.sh
  when: k3s_binary.stat.exists and (force_reinstall | default(false))
  ignore_errors: true

- name: Install k3s on workers
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="agent" K3S_URL=https://{{ hostvars[groups['masters'][0]]['ansible_host'] }}:6443 K3S_TOKEN={{ hostvars[groups['masters'][0]]['k3s_token'] }} sh
  register: k3s_worker_install
  failed_when: k3s_worker_install.rc != 0
  when: not k3s_binary.stat.exists or (force_reinstall | default(false))

- name: Debug k3s worker installation
  debug:
    var: k3s_worker_install
  when: k3s_worker_install is defined and k3s_worker_install.rc | default(0) != 0
