apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:anorum/homelab.git
    targetRevision: HEAD
    path: kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    # Strimzi stamps live defaults into its own CRs; without this the app
    # never reads Synced.
    - group: kafka.strimzi.io
      kind: Kafka
      jsonPointers:
        - /status
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flink-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:anorum/homelab.git
    targetRevision: HEAD
    path: flink-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: flink
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
# The train-spotting project (private repo, read-only deploy key held as the
# trainspotter-repo secret in argocd). Owns everything that would vanish if
# the project died: its topics, its workloads, its FlinkDeployment. The
# platform pieces it relies on (kafka, flink-operator) live in this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blockade
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:anorum/trainspotter.git
    targetRevision: HEAD
    path: deploy
    directory:
      recurse: true
      # deploy/cloud is the Hetzner overlay - a different cluster's world.
      # The base kustomization.yaml files exist for that overlay to consume;
      # as raw documents they are not applyable resources. Neither may reach
      # this cluster.
      exclude: '{cloud/**,**/kustomization.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: blockade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: flink.apache.org
      kind: FlinkDeployment
      jsonPointers:
        - /status
