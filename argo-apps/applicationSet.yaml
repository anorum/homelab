apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    akuity.io/refreshedAt: "25"
  name: airflow-pr
spec:
  generators:
    - pullRequest:
        github:
          owner: anorum
          repo: homelab
          tokenRef:
            secretName: github-token
            key: token
          labels:
            - prenv
        requeueAfterSeconds: 60
  template:
    metadata:
      name: airflow-ephenv-{{number}}
    spec:
      destination:
        namespace: test
        server: https://kubernetes.default.svc
      project: default

      sources:
        - repoURL: git@github.com:anorum/homelab.git
          ref: values
          path: airflow
          kustomize:
            commonLabels:
              app.kubernetes.io/instance: "pull_request-{{number}}"
            namePrefix: "pr{{number}}-"
        - repoURL: https://airflow.apache.org
          targetRevision: 1.15.0  
          chart: airflow
          helm:
            releaseName: pr
            valueFiles:
              - $values/values-common.yaml
            values: |
              extraEnv: |-
                - name: "AIRFLOW__WEBSERVER__INSTANCE_NAME"
                  value: "TESTING PR{{number}}"

      syncPolicy: {}
