apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard
  namespace: adguard
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: DNS Ad Blocking
    gethomepage.dev/group: Homelab
    gethomepage.dev/name: AdGuard
    gethomepage.dev/widget.type: "adguard"
    gethomepage.dev/widget.url: "http://adguard-service.adguard.svc.cluster.local"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
    gethomepage.dev/pod-selector: "app=adguard"
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - adguard.homelab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: adguard-service
          port: 80
