deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 14d
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 6

singleBinary:
  replicas: 1
  persistence:
    storageClass: local-hdd-storage
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# The loki-sc-rules sidecar rides in the same pod and shipped without any
# resources, so the pod was only half-accounted to the scheduler.
sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

# Disable microservice components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Disable optional components to save resources on Pi
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
