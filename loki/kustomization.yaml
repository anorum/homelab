apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: loki

resources:
  - namespace.yaml
  - pv.yaml
  - pvc.yaml
  - httproute.yaml

helmCharts:
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 6.53.0
    releaseName: loki
    namespace: loki
    valuesFile: values.yaml

  - name: promtail
    repo: https://grafana.github.io/helm-charts
    version: 6.17.1
    releaseName: promtail
    namespace: loki
    valuesInline:
      config:
        clients:
          - url: http://loki:3100/loki/api/v1/push
      # Pre-existing limit, raised here: promtail's 7-day peak is exactly its
      # 128Mi ceiling, so it has been running against the wall. A log shipper
      # that dies during a log burst loses the logs explaining the burst.
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 256Mi
      readinessProbe:
        timeoutSeconds: 5
        failureThreshold: 5

labels:
- pairs:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
