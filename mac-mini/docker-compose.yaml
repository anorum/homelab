# Mac Mini services (192.168.1.105)
# Ollama runs natively via macOS app (Metal GPU acceleration)
# Home Assistant runs on separate Pi (homeassistant.local:8123)
# Wyoming STT/TTS run as add-ons on the HA Pi 5
# Deploy: ansible-playbook -i ansible/inventory/hosts.yaml ansible/playbook/deploy-mac-mini.yaml

services:
  homelab-mcp:
    image: python:3.12-slim
    container_name: homelab-mcp
    restart: unless-stopped
    ports:
      - "8881:8080"
    volumes:
      - ./mcp-server:/app
    working_dir: /app
    env_file:
      - .env
    command: >
      sh -c "pip install --quiet -r requirements.txt && python server.py"

  openclaw:
    build:
      context: .
      dockerfile: openclaw.Dockerfile
    container_name: openclaw
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Ollama on host Mac Mini — LAN IP avoids Colima networking quirks
      OLLAMA_BASE_URL: http://192.168.1.105:11434
      OLLAMA_API_KEY: ollama-local
    volumes:
      # Config lives in repo; openclaw/.gitignore keeps runtime writes out of git
      - ./openclaw:/home/node/.openclaw
      # Docker socket intentionally NOT mounted (prevents container escape)
    ports:
      - "127.0.0.1:18789:18789"  # Gateway + Control UI

