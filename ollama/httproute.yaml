apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama
  namespace: ollama
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Ollama"
    gethomepage.dev/description: "Local LLM API"
    gethomepage.dev/group: "AI"
    gethomepage.dev/icon: "ollama"
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - ollama.homelab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ollama
          port: 11434
