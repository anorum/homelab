apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homepage

resources:
  - namespace.yaml

labels:
- pairs:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/instance: homepage

helmCharts:
  - name: homepage
    repo: https://jameswynn.github.io/helm-charts
    releaseName: homepage
    namespace: homepage
    valuesInline:
      config:
        bookmarks:
          - Developer:
              - Github:
                  - abbr: GH
                    href: https://github.com/anorum/homelab
        services:
          - Homelab:
              - AdGuard:
                  href: http://adguard.homelab
                  description: Adguard DNS
              - Argo CD:
                  href: http://argo.homelab
                  description: GitOps Deployment Tool
              - Uptime Kuma:
                  href: http://uptime.homelab
                  description: Internal Status Page
              - Status:
                  href: http://status.homelab
                  description: Internal Status Page

          - Hoyt:
              - Homepage:
                  href: https://hoyt.lol
                  description: Hoyt Dashboard
              - Media:
                  href: https://media.hoyt.lol
                  description: Media
              - Requests:
                  href: https://requests.hoyt.ol
                  description: Request Movies

          - External:
              - Status Page:
                  href: https://status.alexnorum.com
                  description: Uptime Kuma External Status Page
        widgets:
          # show the kubernetes widget, with the cluster summary and individual nodes
          - kubernetes:
              cluster:
                show: true
                cpu: true
                memory: true
                showLabel: true
                label: "cluster"
              nodes:
                show: true
                cpu: true
                memory: true
                showLabel: true
          - search:
              provider: google
              target: _blank
        kubernetes:
          mode: cluster
        settings:

      # The service account is necessary to allow discovery of other services
      serviceAccount:
        create: true
        name: homepage

      # This enables the service account to access the necessary resources
      enableRbac: true

      ingress:
        main:
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/ssl-redirect: "false"
            nginx.ingress.kubernetes.io/rewrite-target: /
            nginx.ingress.kubernetes.io/proxy-redirect-from: /
            nginx.ingress.kubernetes.io/proxy-redirect-to: /
          hosts:
            - host: homelab
              paths:
                - path: /
                  pathType: Prefix
