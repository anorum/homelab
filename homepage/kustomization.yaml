        widgets:
          - kubernetes:
              cluster:
                show: true
                cpu: true
                memory: true
                showLabel: true
                label: "cluster"
              nodes:
                show: true
                cpu: true
                memory: true
                showLabel: true
          - search:
              provider: google
              target: _blank
          - datetime:
              format:
                timeStyle: "short"
                dateStyle: "full"
        kubernetes:
          mode: cluster
        settings:
          title: "Homelab Dashboard"
          theme: dark
          colorScheme: blue
          language: en
          disableCollapse: true
          headerStyle: clean

      serviceAccount:
        create: true
        name: homepage

      enableRbac: true

      ingress:
        main:
          enabled: true
          ingressClassName: nginx
          annotations:
            nginx.ingress.kubernetes.io/ssl-redirect: "false"
            nginx.ingress.kubernetes.io/rewrite-target: /
            nginx.ingress.kubernetes.io/proxy-redirect-from: /
            nginx.ingress.kubernetes.io/proxy-redirect-to: /
          hosts:
            - host: homelab
              paths:
                - path: /
                  pathType: Prefix
