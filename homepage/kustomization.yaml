apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homepage

resources:
  - namespace.yaml
  - cluster-role.yaml
  - config-map.yaml
  - deployment.yaml
  - httproute.yaml
  - secret.yaml
  - service.yaml
  - serviceaccount.yaml

generators:
  - secret-generator.yaml

labels:
- pairs:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/instance: homepage
