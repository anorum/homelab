apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
  settings.yaml: |
    title: "swagman"
    theme: dark
    colorScheme: slate
    language: en
    headerStyle: underlined
    useEqualHeights: true
    cardBlur: md
    background:
      image: https://images.unsplash.com/photo-1518770660439-4636190af475?w=1920&q=80
      blur: md
      brightness: 20
      opacity: 15
    layout:
      Infrastructure:
        style: row
        columns: 2
        header: true
        icon: mdi-server-network
      Development:
        style: row
        columns: 2
        header: true
        icon: mdi-source-branch
      Monitoring:
        style: row
        columns: 4
        header: true
        icon: mdi-chart-areaspline
      Homelab:
        style: row
        columns: 2
        header: true
        icon: mdi-home-assistant
      Home:
        style: row
        columns: 2
        header: true
        icon: mdi-silverware-fork-knife
      AI:
        style: row
        columns: 2
        header: true
        icon: mdi-robot
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: ""
  services.yaml: |
    - Infrastructure:
      - Authentik:
          href: https://sso.alexnorum.com
          description: Identity Provider & SSO
          icon: authentik.png
          siteMonitor: https://sso.alexnorum.com
  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "swagman"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: google
        target: _blank
        focus: false
  docker.yaml: ""
