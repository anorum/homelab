apiVersion: apps/v1
kind: Deployment
metadata:
  name: thehoytwire
  namespace: thehoytwire
  labels:
    app: thehoytwire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thehoytwire
  template:
    metadata:
      labels:
        app: thehoytwire
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: thehoytwire
        image: ghcr.io/anorum/thehoytwire:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 4321
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /
            port: 4321
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 4321
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: thehoytwire
  namespace: thehoytwire
spec:
  selector:
    app: thehoytwire
  ports:
  - port: 80
    targetPort: 4321
  type: ClusterIP
